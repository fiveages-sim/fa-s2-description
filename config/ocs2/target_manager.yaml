/**:
  ros__parameters:
    # 线性控制缩放因子：映射到 */twist 的线速度上限 (m/s，满杆)
    linear_scale: 0.1

    # 角度控制缩放因子：映射到 */twist 的角速度上限 (rad/s，满杆)
    angular_scale: 0.25

    marker_fixed_frame: base_link
    enable_vr: true
    enable_head_control: false

    head_joint_to_rpy_mapping:
      head_joint1: "head_yaw"
      head_joint2: "head_pitch"

    head_rpy_axis_direction:
      head_yaw: 1.0
      head_pitch: 1.0
      head_roll: 1.0

    head_link_name: "head_link2"
